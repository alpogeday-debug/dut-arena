<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Düt Arena</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Inter:wght@400;600;700&display=swap">
<style>
  :root{
    --bg:#100e1c;
    --grid:#241f3a;
    --panel:#1c1830ee;
    --panel-border:#3a3260;
    --text:#f1edfb;
    --text-dim:#a49bcf;
    --accent:#ffce3d;
    --accent-2:#ff4d94;
    color-scheme: dark;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family:'Inter',system-ui,sans-serif;
    overflow:hidden;
  }
  #arena{
    display:block;
    width:100vw;
    height:100vh;
    touch-action:none;
  }
  .hud{
    position:fixed;
    display:flex;
    gap:8px;
    align-items:center;
    z-index:5;
  }
  #title-hud{
    top:calc(16px + env(safe-area-inset-top,0px));
    left:16px;
    flex-direction:column;
    align-items:flex-start;
    gap:4px;
  }
  #title-hud h1{
    font-family:'Press Start 2P',monospace;
    font-size:13px;
    margin:0;
    color:var(--accent);
    text-shadow:0 0 12px #ffce3d55;
    letter-spacing:1px;
    cursor:pointer;
  }
  #player-count{
    font-family:'Press Start 2P',monospace;
    font-size:9px;
    color:var(--text-dim);
    background:var(--panel);
    border:1px solid var(--panel-border);
    padding:6px 10px;
    border-radius:6px;
  }
  #hint-bar{
    bottom:calc(16px + env(safe-area-inset-bottom,0px));
    left:50%;
    transform:translateX(-50%);
    background:var(--panel);
    border:1px solid var(--panel-border);
    padding:8px 16px;
    border-radius:999px;
    font-size:12px;
    color:var(--text-dim);
    white-space:nowrap;
  }
  #hint-bar kbd{
    font-family:'Press Start 2P',monospace;
    font-size:8px;
    background:#000000aa;
    border:1px solid var(--panel-border);
    border-radius:4px;
    padding:2px 5px;
    color:var(--text);
    margin:0 2px;
  }
  #honk-btn{
    position:fixed;
    right:calc(20px + env(safe-area-inset-right,0px));
    bottom:calc(24px + env(safe-area-inset-bottom,0px));
    width:76px;
    height:76px;
    border-radius:50%;
    border:3px solid var(--accent-2);
    background:radial-gradient(circle at 35% 30%, #ff85b8, var(--accent-2));
    color:#2a0018;
    font-family:'Press Start 2P',monospace;
    font-size:10px;
    box-shadow:0 0 24px #ff4d9466, inset 0 0 10px #ffffff55;
    z-index:6;
    cursor:pointer;
    -webkit-tap-highlight-color:transparent;
  }
  #honk-btn:active{ transform:scale(0.92); }
  #chat-box{
    position:fixed;
    left:calc(20px + env(safe-area-inset-left,0px));
    bottom:calc(24px + env(safe-area-inset-bottom,0px));
    display:flex;
    gap:8px;
    z-index:6;
  }
  #chat-input{
    height:52px;
    width:min(46vw, 260px);
    padding:0 16px;
    border-radius:999px;
    border:2px solid var(--panel-border);
    background:var(--panel);
    color:var(--text);
    font-family:'Inter',system-ui,sans-serif;
    font-size:13px;
    outline:none;
  }
  #chat-input::placeholder{ color:var(--text-dim); }
  #chat-input:focus{ border-color:var(--accent); }
  #chat-send{
    height:52px;
    padding:0 18px;
    border-radius:999px;
    border:2px solid var(--panel-border);
    background:var(--panel);
    color:var(--text);
    font-family:'Inter',system-ui,sans-serif;
    font-weight:600;
    font-size:13px;
    cursor:pointer;
    -webkit-tap-highlight-color:transparent;
  }
  #conn-note{
    position:fixed;
    top:calc(16px + env(safe-area-inset-top,0px));
    right:16px;
    font-size:11px;
    color:var(--text-dim);
    background:var(--panel);
    border:1px solid var(--panel-border);
    padding:6px 10px;
    border-radius:6px;
    z-index:5;
    max-width:220px;
  }
  [hidden]{display:none!important}
  @media (max-width:520px){
    #hint-bar{ font-size:10px; padding:7px 12px; }
    #title-hud h1{ font-size:11px; }
  }

  .screen{
    position:fixed;
    inset:0;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:16px;
    padding-block:calc(16px + env(safe-area-inset-top,0px)) calc(16px + env(safe-area-inset-bottom,0px));
    background:var(--bg);
    z-index:10;
  }
  .menu-panel{
    width:100%;
    max-width:360px;
    background:var(--panel);
    border:1px solid var(--panel-border);
    border-radius:16px;
    padding:28px 24px;
    display:flex;
    flex-direction:column;
    gap:14px;
  }
  .menu-panel h1{
    font-family:'Press Start 2P',monospace;
    font-size:20px;
    color:var(--accent);
    text-shadow:0 0 14px #ffce3d55;
    margin:0 0 6px;
    text-align:center;
    letter-spacing:1px;
  }
  .menu-panel h2{
    font-family:'Press Start 2P',monospace;
    font-size:13px;
    color:var(--text);
    margin:0 0 6px;
    text-align:center;
  }
  .menu-btn{
    width:100%;
    height:52px;
    border-radius:12px;
    border:2px solid var(--panel-border);
    background:#241f3a;
    color:var(--text);
    font-family:'Inter',system-ui,sans-serif;
    font-weight:700;
    font-size:15px;
    cursor:pointer;
  }
  .menu-btn.primary{
    border-color:var(--accent-2);
    background:radial-gradient(circle at 30% 20%, #ff85b8, var(--accent-2));
    color:#2a0018;
  }
  .menu-btn.ghost{
    background:transparent;
    border-color:var(--panel-border);
    color:var(--text-dim);
    height:40px;
    font-size:13px;
  }
  .menu-input{
    width:100%;
    height:48px;
    padding:0 14px;
    border-radius:10px;
    border:2px solid var(--panel-border);
    background:#14111f;
    color:var(--text);
    font-family:'Inter',system-ui,sans-serif;
    font-size:14px;
    outline:none;
  }
  .menu-input:focus{ border-color:var(--accent); }
  .menu-hint{
    color:var(--text-dim);
    font-size:12px;
    margin:-8px 0 0;
  }
  .menu-error{
    color:var(--accent-2);
    font-size:13px;
    margin:0;
    min-height:1em;
  }
  .room-list{
    display:flex;
    flex-direction:column;
    gap:8px;
    max-height:44vh;
    overflow-y:auto;
  }
  .room-row{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
    padding:12px 14px;
    border-radius:10px;
    border:2px solid var(--panel-border);
    background:#14111f;
    color:var(--text);
    cursor:pointer;
    font-family:'Inter',system-ui,sans-serif;
    font-size:14px;
    text-align:left;
  }
  .room-row:hover{ border-color:var(--accent); }
  .room-row .count{
    font-family:'Press Start 2P',monospace;
    font-size:9px;
    color:var(--text-dim);
    white-space:nowrap;
  }
  .room-empty{
    color:var(--text-dim);
    font-size:13px;
    text-align:center;
    padding:12px 0;
  }
</style>
</head>
<body>

<canvas id="arena" hidden></canvas>

<div class="hud" id="title-hud" hidden>
  <h1 id="title-link" role="button" tabindex="0">DÜT ARENA</h1>
  <div id="player-count">1 OYUNCU</div>
</div>

<div class="hud" id="hint-bar" hidden>
  <span id="hint-desktop">WASD hareket · sol tık düt</span>
  <span id="hint-mobile" hidden>parmağını sürükle · DÜT'e bas</span>
</div>

<div id="conn-note" hidden>Sunucuya bağlanılamadı — tekrar bağlanmaya çalışılıyor…</div>

<button id="honk-btn" type="button" hidden>DÜT</button>
<div id="chat-box" hidden>
  <input id="chat-input" type="text" placeholder="Mesaj yaz…" maxlength="140">
  <button id="chat-send" type="button">Gönder</button>
</div>

<div class="screen" id="screen-home">
  <div class="menu-panel">
    <h1>DÜT ARENA</h1>
    <button class="menu-btn primary" id="btn-go-join" type="button">Gruba Katıl</button>
    <button class="menu-btn" id="btn-go-create" type="button">Grup Oluştur</button>
  </div>
</div>

<div class="screen" id="screen-create" hidden>
  <div class="menu-panel">
    <h2>GRUP OLUŞTUR</h2>
    <input class="menu-input" id="create-name" type="text" placeholder="Grup adı" maxlength="30">
    <input class="menu-input" id="create-password" type="text" placeholder="Şifre (opsiyonel)" maxlength="60">
    <p class="menu-error" id="create-error"></p>
    <button class="menu-btn primary" id="btn-create-submit" type="button">Oluştur</button>
    <button class="menu-btn ghost" id="btn-create-back" type="button">Geri</button>
  </div>
</div>

<div class="screen" id="screen-join-list" hidden>
  <div class="menu-panel">
    <h2>GRUBA KATIL</h2>
    <div class="room-list" id="room-list"></div>
    <p class="room-empty" id="room-empty" hidden>Henüz grup yok, ilk grubu sen oluştur!</p>
    <button class="menu-btn ghost" id="btn-join-back" type="button">Geri</button>
  </div>
</div>

<div class="screen" id="screen-password" hidden>
  <div class="menu-panel">
    <h2 id="password-room-name">ŞİFRE GEREKLİ</h2>
    <input class="menu-input" id="password-input" type="text" placeholder="Şifre">
    <p class="menu-error" id="password-error"></p>
    <button class="menu-btn primary" id="btn-password-submit" type="button">Katıl</button>
    <button class="menu-btn ghost" id="btn-password-back" type="button">Geri</button>
  </div>
</div>

<script>
(function(){
  "use strict";

  const canvas = document.getElementById('arena');
  const ctx = canvas.getContext('2d');
  const playerCountEl = document.getElementById('player-count');
  const connNote = document.getElementById('conn-note');
  const honkBtn = document.getElementById('honk-btn');
  const chatInput = document.getElementById('chat-input');
  const chatSend = document.getElementById('chat-send');
  const hintDesktop = document.getElementById('hint-desktop');
  const hintMobile = document.getElementById('hint-mobile');
  const titleHud = document.getElementById('title-hud');
  const titleLink = document.getElementById('title-link');
  const hintBar = document.getElementById('hint-bar');
  const chatBox = document.getElementById('chat-box');

  const screens = {
    home: document.getElementById('screen-home'),
    create: document.getElementById('screen-create'),
    joinList: document.getElementById('screen-join-list'),
    password: document.getElementById('screen-password'),
  };
  const gameEls = [canvas, titleHud, hintBar, honkBtn, chatBox];

  let inRoom = false;
  let currentRoomName = null;
  let pendingRoomName = null;
  let latestRoomList = [];

  function showScreen(name){
    for (const key in screens) screens[key].hidden = (key !== name);
    gameEls.forEach(el => { el.hidden = true; });
  }

  function showGame(){
    for (const key in screens) screens[key].hidden = true;
    gameEls.forEach(el => { el.hidden = false; });
  }

  function renderRoomList(){
    const listEl = document.getElementById('room-list');
    const emptyEl = document.getElementById('room-empty');
    listEl.innerHTML = '';
    if (latestRoomList.length === 0) {
      emptyEl.hidden = false;
      return;
    }
    emptyEl.hidden = true;
    for (const room of latestRoomList) {
      const row = document.createElement('button');
      row.type = 'button';
      row.className = 'room-row';
      row.innerHTML = '<span>' + (room.hasPassword ? '🔒 ' : '') + escapeHtml(room.name) + '</span>' +
        '<span class="count">' + room.count + ' OYUNCU</span>';
      row.addEventListener('click', () => attemptJoin(room.name, room.hasPassword));
      listEl.appendChild(row);
    }
  }

  function escapeHtml(s){
    const div = document.createElement('div');
    div.textContent = s;
    return div.innerHTML;
  }

  function attemptJoin(name, hasPassword){
    if (hasPassword) {
      pendingRoomName = name;
      document.getElementById('password-room-name').textContent = name.toUpperCase();
      document.getElementById('password-input').value = '';
      document.getElementById('password-error').textContent = '';
      showScreen('password');
    } else {
      sendJSON({ type: 'join-room', name, password: null });
    }
  }

  document.getElementById('btn-go-join').addEventListener('click', () => {
    sendJSON({ type: 'list-rooms' });
    renderRoomList();
    showScreen('joinList');
  });
  document.getElementById('btn-go-create').addEventListener('click', () => {
    document.getElementById('create-name').value = '';
    document.getElementById('create-password').value = '';
    document.getElementById('create-error').textContent = '';
    showScreen('create');
  });
  document.getElementById('btn-create-back').addEventListener('click', () => showScreen('home'));
  document.getElementById('btn-join-back').addEventListener('click', () => showScreen('home'));
  document.getElementById('btn-password-back').addEventListener('click', () => showScreen('joinList'));

  document.getElementById('btn-create-submit').addEventListener('click', () => {
    const name = document.getElementById('create-name').value.trim();
    const password = document.getElementById('create-password').value.trim();
    if (!name) {
      document.getElementById('create-error').textContent = 'Grup adı zorunlu.';
      return;
    }
    sendJSON({ type: 'create-room', name, password: password || null });
  });

  document.getElementById('btn-password-submit').addEventListener('click', () => {
    const password = document.getElementById('password-input').value;
    sendJSON({ type: 'join-room', name: pendingRoomName, password: password || null });
  });

  titleLink.addEventListener('click', leaveRoom);
  titleLink.addEventListener('keydown', (e) => { if (e.key === 'Enter') leaveRoom(); });

  function leaveRoom(){
    if (!inRoom) return;
    sendJSON({ type: 'leave-room' });
    inRoom = false;
    currentRoomName = null;
    otherPlayers = [];
    chatBubbles.clear();
    pulses.length = 0;
    player.x = 0.5;
    player.y = 0.5;
    showScreen('home');
  }

  const isTouch = matchMedia('(pointer:coarse)').matches;
  hintDesktop.hidden = isTouch;
  hintMobile.hidden = !isTouch;

  function resize(){
    canvas.width = window.innerWidth * devicePixelRatio;
    canvas.height = window.innerHeight * devicePixelRatio;
    canvas.style.width = window.innerWidth + 'px';
    canvas.style.height = window.innerHeight + 'px';
  }
  resize();
  window.addEventListener('resize', resize);

  const ADJ = ['Hızlı','Neon','Gölge','Turbo','Meraklı','Cesur','Sessiz','Parlak','Vahşi','Şanslı'];
  const NOUN = ['Tilki','Kedi','Kartal','Robot','Şahin','Kaplan','Ejder','Baykuş','Kurt','Roket'];
  const COLORS = ['#ff4d94','#ffce3d','#4dd6ff','#7dff6b','#c76bff','#ff8a4d','#4dffb8','#ff4d4d'];

  const myName = ADJ[Math.floor(Math.random()*ADJ.length)] + ' ' + NOUN[Math.floor(Math.random()*NOUN.length)];
  const myColor = COLORS[Math.floor(Math.random()*COLORS.length)];

  const player = { x: 0.5, y: 0.5 };
  const keys = {};
  const SPEED = 0.55;
  let touchTarget = null;
  let myId = null;
  let otherPlayers = [];

  window.addEventListener('keydown', (e) => {
    const active = document.activeElement;
    if (active && (active.tagName === 'INPUT' || active.tagName === 'TEXTAREA')) return;
    const k = e.key.toLowerCase();
    if (['w','a','s','d','arrowup','arrowdown','arrowleft','arrowright'].includes(k)) {
      keys[k] = true;
      e.preventDefault();
    }
  });
  window.addEventListener('keyup', (e) => {
    keys[e.key.toLowerCase()] = false;
  });
  chatInput.addEventListener('focus', () => { for (const k in keys) keys[k] = false; });

  function canvasPointToNorm(clientX, clientY){
    return { x: clientX / window.innerWidth, y: clientY / window.innerHeight };
  }

  canvas.addEventListener('touchstart', (e) => {
    const t = e.touches[0];
    touchTarget = canvasPointToNorm(t.clientX, t.clientY);
  }, {passive:true});
  canvas.addEventListener('touchmove', (e) => {
    const t = e.touches[0];
    touchTarget = canvasPointToNorm(t.clientX, t.clientY);
  }, {passive:true});
  canvas.addEventListener('touchend', () => { touchTarget = null; }, {passive:true});

  let audioCtx = null;
  function ensureAudio(){
    if (!audioCtx) {
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    }
    if (audioCtx.state === 'suspended') audioCtx.resume();
    return audioCtx;
  }

  function playHonk(){
    try {
      const ac = ensureAudio();
      const osc = ac.createOscillator();
      const gain = ac.createGain();
      osc.type = 'square';
      osc.frequency.setValueAtTime(620, ac.currentTime);
      osc.frequency.exponentialRampToValueAtTime(220, ac.currentTime + 0.16);
      gain.gain.setValueAtTime(0.15, ac.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, ac.currentTime + 0.18);
      osc.connect(gain).connect(ac.destination);
      osc.start();
      osc.stop(ac.currentTime + 0.2);
    } catch (err) { /* audio unavailable, silently skip */ }
  }

  const pulses = [];
  function addPulse(x, y, color){
    pulses.push({ x, y, color, start: performance.now() });
  }

  let ws = null;
  let wsConnected = false;

  const chatBubbles = new Map(); // id -> {text, start}

  function sendChat(){
    const text = chatInput.value.trim();
    if (!text) return;
    sendJSON({ type: 'chat', text });
    chatBubbles.set(myId, { text, start: performance.now() });
    chatInput.value = '';
    chatInput.blur();
  }
  chatSend.addEventListener('click', sendChat);
  chatInput.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') sendChat();
  });

  function connect(){
    const proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
    ws = new WebSocket(proto + '//' + location.host);

    ws.onopen = () => { wsConnected = true; connNote.hidden = true; };
    ws.onclose = () => { wsConnected = false; connNote.hidden = false; setTimeout(connect, 1500); };
    ws.onerror = () => { ws.close(); };

    ws.onmessage = (event) => {
      let msg;
      try { msg = JSON.parse(event.data); } catch (e) { return; }

      if (msg.type === 'init') {
        myId = msg.id;
      } else if (msg.type === 'room-list') {
        latestRoomList = msg.rooms;
        if (!screens.joinList.hidden) renderRoomList();
      } else if (msg.type === 'joined-room') {
        inRoom = true;
        currentRoomName = msg.name;
        otherPlayers = [];
        chatBubbles.clear();
        pulses.length = 0;
        player.x = 0.5;
        player.y = 0.5;
        showGame();
      } else if (msg.type === 'create-error') {
        document.getElementById('create-error').textContent =
          msg.reason === 'taken' ? 'Geçersiz isim, lütfen değiştirin.' : 'Grup adı zorunlu.';
      } else if (msg.type === 'join-error') {
        if (!screens.password.hidden) {
          document.getElementById('password-error').textContent =
            msg.reason === 'wrong-password' ? 'Yanlış şifre.' : 'Bu grup artık mevcut değil.';
        } else {
          sendJSON({ type: 'list-rooms' });
          showScreen('joinList');
        }
      } else if (msg.type === 'state') {
        otherPlayers = msg.players.filter(p => p.id !== myId);
        playerCountEl.textContent = (otherPlayers.length + 1) + ' OYUNCU';
      } else if (msg.type === 'honk') {
        playHonk();
        addPulse(msg.x, msg.y, msg.color || '#ffffff');
      } else if (msg.type === 'chat') {
        if (msg.id !== myId) {
          chatBubbles.set(msg.id, { text: msg.text, start: performance.now() });
        }
      }
    };
  }
  connect();
  showScreen('home');

  function sendJSON(obj){
    if (ws && wsConnected) {
      try { ws.send(JSON.stringify(obj)); } catch (e) { /* ignore */ }
    }
  }

  function localHonk(){
    playHonk();
    addPulse(player.x, player.y, myColor);
    sendJSON({ type: 'honk', x: player.x, y: player.y, color: myColor });
  }

  honkBtn.addEventListener('click', localHonk);
  canvas.addEventListener('mousedown', (e) => {
    if (e.button === 0) localHonk();
  });

  let lastT = performance.now();
  let lastPresenceSent = 0;

  function tick(now){
    const dt = Math.min((now - lastT) / 1000, 0.05);
    lastT = now;

    if (!inRoom) {
      requestAnimationFrame(tick);
      return;
    }

    let dx = 0, dy = 0;
    if (keys['w'] || keys['arrowup']) dy -= 1;
    if (keys['s'] || keys['arrowdown']) dy += 1;
    if (keys['a'] || keys['arrowleft']) dx -= 1;
    if (keys['d'] || keys['arrowright']) dx += 1;

    if (dx !== 0 || dy !== 0) {
      const len = Math.hypot(dx, dy);
      player.x += (dx / len) * SPEED * dt;
      player.y += (dy / len) * SPEED * dt;
    } else if (touchTarget) {
      const tdx = touchTarget.x - player.x;
      const tdy = touchTarget.y - player.y;
      const dist = Math.hypot(tdx, tdy);
      if (dist > 0.01) {
        player.x += (tdx / dist) * SPEED * dt;
        player.y += (tdy / dist) * SPEED * dt;
      }
    }

    const margin = 0.03;
    player.x = Math.max(margin, Math.min(1 - margin, player.x));
    player.y = Math.max(margin, Math.min(1 - margin, player.y));

    if (now - lastPresenceSent > 50) {
      sendJSON({ type: 'presence', x: player.x, y: player.y, color: myColor, name: myName });
      lastPresenceSent = now;
    }

    render(now);
    requestAnimationFrame(tick);
  }

  function drawGrid(){
    const w = canvas.width, h = canvas.height;
    const step = 48 * devicePixelRatio;
    ctx.strokeStyle = '#241f3a';
    ctx.lineWidth = 1;
    for (let gx = 0; gx < w; gx += step) {
      ctx.beginPath(); ctx.moveTo(gx, 0); ctx.lineTo(gx, h); ctx.stroke();
    }
    for (let gy = 0; gy < h; gy += step) {
      ctx.beginPath(); ctx.moveTo(0, gy); ctx.lineTo(w, gy); ctx.stroke();
    }
  }

  const CHAT_TTL = 4000;

  function drawPlayer(id, nx, ny, color, label, isMe, now){
    const x = nx * canvas.width;
    const y = ny * canvas.height;
    const r = 16 * devicePixelRatio;

    ctx.save();
    ctx.shadowColor = color;
    ctx.shadowBlur = 18 * devicePixelRatio;
    ctx.fillStyle = color;
    ctx.beginPath();
    ctx.arc(x, y, r, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();

    ctx.strokeStyle = '#ffffffcc';
    ctx.lineWidth = 2 * devicePixelRatio;
    ctx.beginPath();
    ctx.arc(x, y, r, 0, Math.PI * 2);
    ctx.stroke();

    ctx.font = (10 * devicePixelRatio) + "px 'Press Start 2P', monospace";
    ctx.fillStyle = '#f1edfb';
    ctx.textAlign = 'center';
    ctx.fillText(label + (isMe ? ' (sen)' : ''), x, y - r - 10 * devicePixelRatio);

    const bubble = chatBubbles.get(id);
    if (bubble) {
      const age = now - bubble.start;
      if (age > CHAT_TTL) {
        chatBubbles.delete(id);
      } else {
        ctx.save();
        ctx.globalAlpha = age > CHAT_TTL - 500 ? (CHAT_TTL - age) / 500 : 1;
        ctx.font = (12 * devicePixelRatio) + "px 'Inter', system-ui, sans-serif";
        const paddingX = 10 * devicePixelRatio;
        const paddingY = 6 * devicePixelRatio;
        const textWidth = ctx.measureText(bubble.text).width;
        const bw = textWidth + paddingX * 2;
        const bh = 22 * devicePixelRatio;
        const bx = x - bw / 2;
        const by = y - r - 34 * devicePixelRatio - bh;
        ctx.fillStyle = '#1c1830ee';
        ctx.strokeStyle = color;
        ctx.lineWidth = 1.5 * devicePixelRatio;
        ctx.beginPath();
        ctx.roundRect(bx, by, bw, bh, 8 * devicePixelRatio);
        ctx.fill();
        ctx.stroke();
        ctx.fillStyle = '#f1edfb';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(bubble.text, x, by + bh / 2 + 1);
        ctx.textBaseline = 'alphabetic';
        ctx.restore();
      }
    }
  }

  function drawPulses(now){
    for (let i = pulses.length - 1; i >= 0; i--) {
      const p = pulses[i];
      const age = (now - p.start) / 1000;
      if (age > 0.6) { pulses.splice(i, 1); continue; }
      const t = age / 0.6;
      const x = p.x * canvas.width;
      const y = p.y * canvas.height;
      const r = (16 + t * 60) * devicePixelRatio;
      ctx.save();
      ctx.globalAlpha = 1 - t;
      ctx.strokeStyle = p.color;
      ctx.lineWidth = 4 * devicePixelRatio;
      ctx.beginPath();
      ctx.arc(x, y, r, 0, Math.PI * 2);
      ctx.stroke();
      ctx.restore();
    }
  }

  function render(now){
    ctx.fillStyle = '#100e1c';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    drawGrid();

    drawPlayer(myId, player.x, player.y, myColor, myName, true, now);
    for (const p of otherPlayers) {
      if (typeof p.x !== 'number' || typeof p.y !== 'number') continue;
      drawPlayer(p.id, p.x, p.y, p.color || '#888', p.name || 'Oyuncu', false, now);
    }

    drawPulses(now);
  }

  requestAnimationFrame(tick);
})();
</script>
</body>
