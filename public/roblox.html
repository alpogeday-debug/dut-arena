<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Roblox Dünyası - Düt Arena</title>
<style>
  html,body{ margin:0; padding:0; width:100%; height:100%; overflow:hidden; background:#0d0d14; font-family:system-ui,-apple-system,sans-serif; }
  canvas{ display:block; }
  #hud{
    position:fixed; top:0; left:0; right:0; z-index:10;
    display:flex; align-items:center; justify-content:space-between;
    padding:12px 16px; box-sizing:border-box;
    background:linear-gradient(to bottom, rgba(0,0,0,.55), transparent);
    pointer-events:none;
  }
  #hud a{
    pointer-events:auto;
    color:#fff; text-decoration:none; background:rgba(20,20,30,.65);
    border:1px solid rgba(255,255,255,.2); border-radius:10px;
    padding:8px 14px; font-size:14px; font-weight:600;
  }
  #hud a:hover{ background:rgba(40,40,55,.85); }
  #hint{
    color:#fff; font-size:13px; background:rgba(20,20,30,.55);
    border:1px solid rgba(255,255,255,.15); border-radius:10px;
    padding:8px 14px; pointer-events:none;
  }
  #loading{
    position:fixed; inset:0; z-index:20; display:flex; align-items:center; justify-content:center;
    background:#0d0d14; color:#fff; font-size:18px; flex-direction:column; gap:10px;
  }
  #start-screen, #avatar-screen{
    position:fixed; inset:0; z-index:15; display:flex; align-items:center; justify-content:center;
    background:#0d0d14; overflow-y:auto; padding:20px 0; box-sizing:border-box;
  }
  #avatar-screen{ z-index:16; display:none; }
  #avatar-screen.open{ display:flex; }
  .start-card{
    background:rgba(22,22,34,.95); border:1px solid rgba(255,255,255,.15);
    border-radius:16px; padding:24px 28px; text-align:center; color:#fff;
    max-width:380px; width:90%; box-shadow:0 10px 40px rgba(0,0,0,.5);
  }
  .start-card.wide{ max-width:680px; }
  .start-card h1{ margin:0; font-size:24px; }
  .start-card h2{ margin:0 0 18px; font-size:20px; }
  .home-top-row{ display:flex; align-items:center; justify-content:space-between; margin-bottom:18px; }
  .lobby-hint{ margin:0 0 8px; font-size:13px; color:#a9a9c0; text-align:left; }
  .lobby-btn{
    font-size:15px; font-weight:700; color:#fff; background:#2e9e4a;
    border:none; border-radius:10px; padding:10px 20px; cursor:pointer;
  }
  .lobby-btn:hover{ background:#36b357; }
  .ghost-btn{
    font-size:14px; font-weight:700; color:#fff; background:rgba(255,255,255,.08);
    border:1px solid rgba(255,255,255,.2); border-radius:10px; padding:9px 16px; cursor:pointer;
  }
  .ghost-btn:hover{ background:rgba(255,255,255,.16); }
  .name-row{ display:flex; gap:8px; margin-bottom:14px; }
  .name-row input{
    flex:1; box-sizing:border-box; font-size:14px; padding:9px 12px;
    border-radius:9px; border:1px solid rgba(255,255,255,.2); background:rgba(255,255,255,.06); color:#fff;
  }
  .game-grid{
    display:grid; grid-template-columns:repeat(auto-fill, minmax(150px, 1fr)); gap:14px;
    max-height:62vh; overflow-y:auto; padding:4px 4px 4px 0; text-align:left;
  }
  .game-tile{
    cursor:pointer; background:rgba(255,255,255,.05); border:1px solid rgba(255,255,255,.12);
    border-radius:10px; overflow:hidden; transition:transform .12s, border-color .12s;
  }
  .game-tile:hover{ transform:translateY(-2px); border-color:#4da3ff; }
  .game-tile .thumb{
    width:100%; aspect-ratio:1/1; display:flex; align-items:center; justify-content:center; font-size:46px;
  }
  .game-tile .meta{ padding:8px 9px 10px; }
  .game-tile .title{
    font-size:12.5px; font-weight:700; line-height:1.25; margin:0 0 4px;
    display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden;
  }
  .game-tile .rating{ font-size:11px; color:#9aa0b0; }
  .swatch-row{ display:flex; gap:8px; margin-bottom:16px; flex-wrap:wrap; justify-content:center; }
  .swatch{ width:34px; height:34px; border-radius:8px; cursor:pointer; border:3px solid transparent; }
  .swatch.selected{ border-color:#fff; }
  #room-badge{
    pointer-events:none; color:#fff; font-size:13px; font-weight:700;
    background:rgba(20,20,30,.65); border:1px solid rgba(255,255,255,.2);
    border-radius:10px; padding:8px 14px;
  }
  #chat-panel{
    position:fixed; left:16px; bottom:16px; z-index:10; width:280px;
    display:flex; flex-direction:column; gap:6px;
  }
  #chat-log{
    max-height:160px; overflow-y:auto; display:flex; flex-direction:column; gap:3px;
    font-size:13px;
  }
  #chat-log div{
    color:#fff; background:rgba(10,10,18,.6); border-radius:7px; padding:4px 9px; width:fit-content; max-width:100%;
    word-break:break-word;
  }
  #chat-log b{ color:#8ecbff; }
  #chat-input{
    font-size:13px; padding:9px 12px; border-radius:9px; border:1px solid rgba(255,255,255,.2);
    background:rgba(10,10,18,.6); color:#fff;
  }
  #chat-input::placeholder{ color:#8d8da8; }
  #interact-prompt{
    position:fixed; left:50%; bottom:120px; transform:translateX(-50%); z-index:10;
    color:#fff; font-size:14px; font-weight:700; background:rgba(20,20,30,.75);
    border:1px solid rgba(255,255,255,.25); border-radius:10px; padding:8px 16px;
  }
  #inventory-bar{
    position:fixed; left:50%; bottom:16px; transform:translateX(-50%); z-index:10;
    display:flex; gap:8px;
  }
  .inv-slot{
    width:54px; height:54px; border-radius:10px; cursor:pointer;
    background:rgba(20,20,30,.65); border:2px solid rgba(255,255,255,.2);
    display:flex; align-items:center; justify-content:center; font-size:26px;
  }
  .inv-slot.selected{ border-color:#ffd23f; background:rgba(255,210,63,.18); }
  .inv-slot.empty{ opacity:.45; }
</style>
</head>
<body>

<div id="loading">🧱 Yükleniyor…</div>

<div id="start-screen">
  <div class="start-card wide">
    <div class="home-top-row">
      <h1>🎮 Roblox Dünyası</h1>
      <button type="button" class="ghost-btn" id="avatar-btn">🧑 Avatar</button>
    </div>
    <div class="name-row">
      <input type="text" id="name-input" maxlength="20" placeholder="Görünecek adın">
    </div>
    <p class="lobby-hint">Bir oyun seç, katıldığın herkesle aynı dünyaya düşersin</p>
    <div class="game-grid" id="game-grid"></div>
  </div>
</div>

<div id="avatar-screen">
  <div class="start-card">
    <h2>🧑 Avatarını Özelleştir</h2>
    <p class="lobby-hint">Üst (Gömlek)</p>
    <div class="swatch-row" id="shirt-swatches"></div>
    <p class="lobby-hint">Alt (Pantolon)</p>
    <div class="swatch-row" id="pants-swatches"></div>
    <button type="button" class="lobby-btn" id="avatar-close-btn">Kaydet ve Kapat</button>
  </div>
</div>

<div id="hud">
  <a href="/">⬅️ Düt Arena'ya Dön</a>
  <div id="room-badge" hidden>🎮 <span id="room-code-text"></span></div>
  <div id="hint">WASD: Hareket • Shift: Koş • Boşluk: Zıpla • E: Etkileşim • G: Ver • Fare: Kamera</div>
</div>

<div id="interact-prompt" hidden></div>

<div id="inventory-bar" hidden></div>

<div id="chat-panel" hidden>
  <div id="chat-log"></div>
  <input type="text" id="chat-input" maxlength="140" placeholder="Mesaj yaz, Enter'a bas...">
</div>

<script src="https://unpkg.com/three@0.128.0/build/three.min.js"></script>
<script>
(function(){
  "use strict";

  var scene = new THREE.Scene();
  scene.background = new THREE.Color(0x8ec9f0);
  scene.fog = new THREE.Fog(0x8ec9f0, 40, 140);

  var camera = new THREE.PerspectiveCamera(60, window.innerWidth/window.innerHeight, 0.1, 500);

  var renderer = new THREE.WebGLRenderer({ antialias:true });
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
  renderer.shadowMap.enabled = true;
  document.body.appendChild(renderer.domElement);

  // Lights
  var hemi = new THREE.HemisphereLight(0xffffff, 0x3a3a3a, 0.9);
  scene.add(hemi);
  var sun = new THREE.DirectionalLight(0xffffff, 0.9);
  sun.position.set(30, 50, 20);
  sun.castShadow = true;
  sun.shadow.mapSize.set(2048, 2048);
  sun.shadow.camera.left = -60; sun.shadow.camera.right = 60;
  sun.shadow.camera.top = 60; sun.shadow.camera.bottom = -60;
  scene.add(sun);

  // Ground (classic Roblox grey baseplate)
  var groundGeo = new THREE.PlaneGeometry(400, 400);
  var groundMat = new THREE.MeshStandardMaterial({ color:0xa3a2a5, roughness:0.95 });
  var ground = new THREE.Mesh(groundGeo, groundMat);
  ground.rotation.x = -Math.PI/2;
  ground.receiveShadow = true;
  scene.add(ground);

  var grid = new THREE.GridHelper(400, 80, 0x707070, 0x8c8c8c);
  grid.position.y = 0.01;
  scene.add(grid);

  // Blocks — solid, so the character collides with them. Rebuilt per map.
  var CHAR_RADIUS = 0.75;
  var solidBlocks = [];
  var mapMeshes = [];
  function addBlock(x, z, w, h, d, color){
    var m = new THREE.Mesh(
      new THREE.BoxGeometry(w, h, d),
      new THREE.MeshStandardMaterial({ color:color, roughness:0.8 })
    );
    m.position.set(x, h/2, z);
    m.castShadow = true; m.receiveShadow = true;
    scene.add(m);
    mapMeshes.push(m);
    solidBlocks.push({ x:x, z:z, halfW: w/2 + CHAR_RADIUS, halfD: d/2 + CHAR_RADIUS });
  }

  function hitsSolid(x, z){
    for (var i=0; i<solidBlocks.length; i++){
      var b = solidBlocks[i];
      if (Math.abs(x - b.x) < b.halfW && Math.abs(z - b.z) < b.halfD) return true;
    }
    return false;
  }

  // Interactable objects — floating markers you can press E near to trigger something
  var interactables = [];
  var INTERACT_RADIUS = 3.2;
  function addInteractable(x, z, label, onInteract){
    var marker = new THREE.Mesh(
      new THREE.OctahedronGeometry(0.45),
      new THREE.MeshStandardMaterial({ color:0xffd23f, emissive:0x7a5a00, roughness:0.4 })
    );
    marker.position.set(x, 1.6, z);
    marker.castShadow = true;
    scene.add(marker);
    mapMeshes.push(marker);
    interactables.push({ x:x, z:z, label:label, marker:marker, onInteract:onInteract });
  }
  function tryInteract(){
    if (!started) return;
    for (var i=0; i<interactables.length; i++){
      var it = interactables[i];
      var dx = character.position.x - it.x, dz = character.position.z - it.z;
      if (dx*dx + dz*dz <= INTERACT_RADIUS*INTERACT_RADIUS){
        it.onInteract();
        return;
      }
    }
  }

  function addHouse(x, z, color, scale){
    var s = scale || 1;
    addBlock(x, z, 7*s, 4*s, 7*s, color);
    addBlock(x, z, 7.8*s, 1*s, 7.8*s, 0x7a4a2b);
  }

  var MAP_THEMES = {
    kacis: function(){ // Kaçış Binası — a bigger corridor maze
      groundMat.color.set(0x55575e);
      addBlock(0, -8, 22, 4, 1, 0x3a3d45);
      addBlock(10, 0, 1, 4, 18, 0x3a3d45);
      addBlock(-10, 0, 1, 4, 18, 0x3a3d45);
      addBlock(0, 16, 16, 4, 1, 0x3a3d45);
      addBlock(16, 16, 1, 4, 16, 0x3a3d45);
      addBlock(-16, 16, 1, 4, 16, 0x3a3d45);
      addBlock(0, -1, 10, 4, 1, 0x4a4d58);
      addBlock(6, 8, 1, 4, 8, 0x4a4d58);
      addBlock(-6, 8, 1, 4, 8, 0x4a4d58);
      addBlock(0, 24, 20, 4, 1, 0x3a3d45);
    },
    ciftlik: function(){ // Evcil Hayvan Çiftliği — bigger barn + two pens
      groundMat.color.set(0x8fae5e);
      addBlock(14, 10, 0.5, 1.4, 12, 0xa9772f);
      addBlock(20, 4, 12, 1.4, 0.5, 0xa9772f);
      addBlock(20, 16, 12, 1.4, 0.5, 0xa9772f);
      addBlock(26, 10, 0.5, 1.4, 12, 0xa9772f);
      addBlock(-14, 10, 0.5, 1.4, 10, 0xa9772f);
      addBlock(-20, 5, 10, 1.4, 0.5, 0xa9772f);
      addBlock(-20, 15, 10, 1.4, 0.5, 0xa9772f);
      addBlock(-26, 10, 0.5, 1.4, 10, 0xa9772f);
      addHouse(-10, -12, 0xb03a3a, 1.4);
      addHouse(10, -14, 0xd9a23a, 1.1);
    },
    kule: function(){ // Zorluk Kulesi — a taller zig-zag path upward
      groundMat.color.set(0x6b6f7a);
      addBlock(0, -10, 6, 3, 6, 0x9aa0ad);
      addBlock(8, -4, 6, 3, 6, 0x9aa0ad);
      addBlock(0, 2, 6, 3, 6, 0x9aa0ad);
      addBlock(-8, 8, 6, 3, 6, 0x9aa0ad);
      addBlock(0, 14, 6, 3, 6, 0x9aa0ad);
      addBlock(8, 20, 6, 3, 6, 0x9aa0ad);
      addBlock(0, 26, 6, 3, 6, 0x9aa0ad);
      addBlock(-8, 32, 8, 3, 8, 0xc0c6d0);
    },
    mahalle: function(){ // Komşu Mahallesi — a bigger neighborhood
      groundMat.color.set(0x9fcf7a);
      addHouse(14, 14, 0xd98c3a);
      addHouse(-14, 14, 0x4a90c0);
      addHouse(14, -14, 0xb0463a);
      addHouse(-14, -14, 0x6ab04a);
      addHouse(26, 0, 0x8e44ad);
      addHouse(-26, 0, 0x16a085);
      addHouse(0, 26, 0xe67e22);
      addHouse(0, -26, 0x2c3e50);
    },
    arena: function(){ // Savaş Arenası — bigger ring, more cover
      groundMat.color.set(0x8c6a6a);
      var n = 20, r = 34;
      for (var i = 0; i < n; i++){
        var a = (i/n) * Math.PI*2;
        addBlock(Math.cos(a)*r, Math.sin(a)*r, 5, 4, 5, 0x6b3a3a);
      }
      addBlock(8, 0, 4, 2, 4, 0xb08a3a);
      addBlock(-8, 8, 4, 2, 4, 0xb08a3a);
      addBlock(-8, -8, 4, 2, 4, 0xb08a3a);
      addBlock(8, 8, 4, 2, 4, 0xb08a3a);
      addBlock(8, -8, 4, 2, 4, 0xb08a3a);
      addBlock(0, 0, 5, 3, 5, 0xc9a23a);
    },
    yaris: function(){ // Yarış Pisti — a bigger oval barrier
      groundMat.color.set(0x4a4a52);
      var pts = 32, rx = 42, rz = 26;
      for (var i = 0; i < pts; i++){
        var a = (i/pts) * Math.PI*2;
        addBlock(Math.cos(a)*rx, Math.sin(a)*rz, 1.8, 1.4, 1.8, 0xd94a3a);
      }
      var pts2 = 20, rx2 = 20, rz2 = 10;
      for (var j = 0; j < pts2; j++){
        var a2 = (j/pts2) * Math.PI*2;
        addBlock(Math.cos(a2)*rx2, Math.sin(a2)*rz2, 1.4, 1, 1.4, 0xf0f0f0);
      }
    },
    ada: function(){ // Hayatta Kalma Adası — more rocks and trees
      groundMat.color.set(0xd8c27a);
      addBlock(8, 6, 2.5, 7, 2.5, 0x6b4a2b);
      addBlock(14, 10, 3, 4, 3, 0x4a8a3a);
      addBlock(-10, -8, 3, 6, 3, 0x6b4a2b);
      addBlock(-16, -12, 3, 4, 3, 0x4a8a3a);
      addBlock(3, -14, 4, 3, 4, 0x7a7a7a);
      addBlock(-5, 14, 4, 3, 4, 0x7a7a7a);
      addBlock(18, -4, 2.5, 5, 2.5, 0x6b4a2b);
      addBlock(-18, 4, 2.5, 5, 2.5, 0x6b4a2b);
    },
    restoran: function(){ // Restoranını İşlet — bigger building + more tables
      groundMat.color.set(0xbfa06a);
      addBlock(0, -16, 16, 4, 3, 0x8a5a3a);
      [[-9,-3],[-3,-3],[3,-3],[9,-3],[-9,5],[-3,5],[3,5],[9,5],[-6,13],[6,13]].forEach(function(p){
        addBlock(p[0], p[1], 1.8, 1.2, 1.8, 0x5a5a5a);
      });
    },
    ajan: function(){ // Gizli Ajan — more crates and corridors
      groundMat.color.set(0x2c2c38);
      addBlock(12, 8, 4, 3, 4, 0x45455a);
      addBlock(-12, 8, 4, 3, 4, 0x45455a);
      addBlock(12, -10, 4, 3, 4, 0x45455a);
      addBlock(-12, -10, 4, 3, 4, 0x45455a);
      addBlock(20, 0, 3, 3, 3, 0x3a3a4a);
      addBlock(-20, 0, 3, 3, 3, 0x3a3a4a);
      addBlock(0, 16, 3, 3, 3, 0x3a3a4a);
      addBlock(0, -16, 3, 3, 3, 0x3a3a4a);
      addBlock(0, 0, 6, 3, 6, 0x555570);
    },
    sehir: function(){ // Şehir İnşa Et — more, taller skyscrapers
      groundMat.color.set(0x6e6e76);
      addBlock(10, 10, 6, 16, 6, 0x5a7a9a);
      addBlock(-10, 10, 5, 24, 5, 0x4a6a8a);
      addBlock(10, -10, 5, 10, 5, 0x7a8aa0);
      addBlock(-10, -10, 6, 20, 6, 0x5a7a9a);
      addBlock(22, 0, 5, 12, 5, 0x6a8ab0);
      addBlock(-22, 0, 4, 8, 4, 0x8a9ab8);
      addBlock(0, 22, 7, 28, 7, 0x4a6a8a);
      addBlock(0, -22, 5, 14, 5, 0x5a7a9a);
    },
    zombi: function(){ // Zombi Kaçışı — more barricades + a safehouse
      groundMat.color.set(0x5a6b4a);
      var n = 16, r = 28;
      for (var i = 0; i < n; i++){
        var a = (i/n) * Math.PI*2;
        addBlock(Math.cos(a)*r, Math.sin(a)*r, 2.5, 3, 1.4, 0x4a4030);
      }
      addHouse(0, 0, 0x5a5a4a, 1.2);
    },
    balik: function(){ // Balık Tut — longer pier + dock house
      groundMat.color.set(0x3a6a8a);
      addBlock(0, 2, 5, 0.8, 26, 0x8a5a3a);
      addBlock(-3, -6, 0.8, 1.8, 0.8, 0x6b4a2b);
      addBlock(3, 2, 0.8, 1.8, 0.8, 0x6b4a2b);
      addBlock(-3, 10, 0.8, 1.8, 0.8, 0x6b4a2b);
      addHouse(10, -12, 0x8a5a3a, 1);
    },
    basketbol: function(){ // Basketbol Sahası — bigger court + stands
      groundMat.color.set(0xb5652f);
      addBlock(0, -22, 0.6, 5, 4, 0xe0e0e0);
      addBlock(0, 22, 0.6, 5, 4, 0xe0e0e0);
      addBlock(-18, 0, 2, 3, 10, 0x7a7a80);
      addBlock(18, 0, 2, 3, 10, 0x7a7a80);
    },
    parkur: function(){ // Parkur Haritası — more, bigger platforms
      groundMat.color.set(0x8a8f6e);
      addBlock(0, -12, 4, 1.4, 14, 0x8e5a2b);
      addBlock(12, -3, 14, 1.4, 4, 0x8e5a2b);
      addBlock(12, 14, 4, 1.4, 14, 0x8e5a2b);
      addBlock(0, 22, 14, 1.4, 4, 0x8e5a2b);
      addBlock(-12, 14, 4, 1.4, 14, 0x8e5a2b);
      addBlock(-12, -5, 4, 1.4, 8, 0x8e5a2b);
      addBlock(-4, -20, 4, 1.4, 4, 0xa9772f);
    },
    skatepark: function(){ // Skate Parkı — more ramps
      groundMat.color.set(0x8a8a90);
      addBlock(8, -6, 6, 1.2, 6, 0xb0b0b8);
      addBlock(-8, 6, 6, 1.8, 6, 0xb0b0b8);
      addBlock(0, 14, 9, 1, 4, 0xb0b0b8);
      addBlock(14, 10, 4, 2.4, 4, 0xb0b0b8);
      addBlock(-14, -8, 5, 1.4, 5, 0xb0b0b8);
      addBlock(0, -16, 8, 0.8, 4, 0xb0b0b8);
    },
    classic: function(){
      groundMat.color.set(0xa3a2a5);
      addBlock(14, -8, 6, 6, 6, 0xc0392b);
      addBlock(-16, 10, 8, 3, 8, 0x2980b9);
      addBlock(8, 18, 4, 8, 4, 0x27ae60);
      addBlock(-10, -18, 7, 4, 7, 0xf39c12);
      addBlock(20, 10, 4, 5, 4, 0x8e44ad);
      addBlock(-20, -6, 5, 4, 5, 0x16a085);
    }
  };

  var INTERACT_FLAVORS = {
    ciftlik: { label:'🌾 Hayvanları Besle', msg:'🐾 Hayvanları besledin ve bir', item:{emoji:'🥚',name:'Yumurta'} },
    restoran: { label:'🍳 Sipariş Hazırla', msg:'🍔 Bir sipariş hazırladın:', item:{emoji:'🍔',name:'Hamburger'} },
    ajan: { label:'🔍 İpucu Ara', msg:'🕵️ Bir ipucu buldun:', item:{emoji:'🔑',name:'İpucu'} },
    sehir: { label:'🏗️ İnşa Et', msg:'🏙️ Topladığın malzeme:', item:{emoji:'🧱',name:'Tuğla'} },
    balik: { label:'🎣 Olta At', msg:'🐟 Bir balık yakaladın:', item:{emoji:'🐟',name:'Balık'} },
    zombi: { label:'🔧 Barikat Kur', msg:'🧟 Barikatı sağlamlaştırdın, elinde:', item:{emoji:'🔧',name:'Alet'} },
    basketbol: { label:'🏀 Şut At', msg:'🏀 Potayı buldun!', item:null },

  function roundRect(ctx,x,y,w,h,r){
    ctx.beginPath();
    ctx.moveTo(x+r,y);
    ctx.arcTo(x+w,y,x+w,y+h,r);
    ctx.arcTo(x+w,y+h,x,y+h,r);
    ctx.arcTo(x,y+h,x,y,r);
    ctx.arcTo(x,y,x+w,y,r);
    ctx.closePath();
  }
  function makeNameTexture(text){
    var canvas = document.createElement('canvas');
    canvas.width = 256; canvas.height = 64;
    var ctx = canvas.getContext('2d');
    ctx.font = 'bold 30px system-ui, sans-serif';
    var textWidth = ctx.measureText(text).width;
    var boxW = Math.min(246, textWidth + 36);
    var boxX = (256 - boxW)/2;
    ctx.fillStyle = 'rgba(10,10,18,0.6)';
    roundRect(ctx, boxX, 12, boxW, 40, 10); ctx.fill();
    ctx.fillStyle = '#ffffff';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(text, 128, 33);
    return new THREE.CanvasTexture(canvas);
  }

  function connectWs(){
    ws = new WebSocket(wsProto + '//' + location.host);
    ws.addEventListener('open', function(){
      if (pendingAction){ ws.send(JSON.stringify(pendingAction)); pendingAction = null; }
    });
    ws.addEventListener('message', function(ev){
      var msg;
      try { msg = JSON.parse(ev.data); } catch(e){ return; }
      if (msg.type === 'rbx-joined'){
        myRbxId = msg.selfId;
        currentRoomCode = msg.code;
        clearRemotePlayers();
        loadMap(msg.mapId);
        character.position.set(0,0,0);
        velocityY = 0; isGrounded = true;
        (msg.players||[]).forEach(function(p){ if (p.id !== myRbxId) addRemotePlayer(p); });
        document.getElementById('room-code-text').textContent = msg.code;
        document.getElementById('room-badge').hidden = false;
        document.getElementById('start-screen').style.display = 'none';
        document.getElementById('chat-panel').hidden = false;
        document.getElementById('inventory-bar').hidden = false;
        started = true;
      } else if (msg.type === 'rbx-player-joined'){
        addRemotePlayer(msg);
        appendChat('Sistem', (msg.name||'Biri') + ' katıldı');
      } else if (msg.type === 'rbx-player-left'){
        removeRemotePlayer(msg.id);
      } else if (msg.type === 'rbx-pos'){
        var rp = remotePlayers[msg.id];
        if (rp) rp.target = { x:msg.x, y:msg.y, z:msg.z, ry:msg.ry };
      } else if (msg.type === 'rbx-chat'){
        appendChat(msg.name || 'Oyuncu', msg.text);
      } else if (msg.type === 'rbx-item-received'){
        var item = msg.item || { emoji:'🎁', name:'Eşya' };
        if (addToInventory(item)) appendChat('Sistem', (msg.fromName||'Biri') + ' sana bir ' + item.name + ' verdi! ' + item.emoji);
        else appendChat('Sistem', (msg.fromName||'Biri') + ' sana bir ' + item.name + ' vermek istedi ama envanterin dolu.');
      }
    });
    ws.addEventListener('close', function(){ setTimeout(connectWs, 1500); });
  }

  function tryGive(){
    if (!started || selectedSlot < 0 || !inventory[selectedSlot]) return;
    var GIVE_RADIUS = 4;
    var nearestId = null, nearestDist = GIVE_RADIUS * GIVE_RADIUS;
    Object.keys(remotePlayers).forEach(function(rid){
      var rp = remotePlayers[rid];
      var dx = character.position.x - rp.group.position.x, dz = character.position.z - rp.group.position.z;
      var d2 = dx*dx + dz*dz;
      if (d2 <= nearestDist){ nearestDist = d2; nearestId = rid; }
    });
    if (nearestId === null){ appendChat('Sistem', 'Vermek için yakında birisi olmalı.'); return; }
    var item = inventory[selectedSlot];
    inventory[selectedSlot] = null;
    selectedSlot = -1;
    renderInventory();
    sendOrQueue({ type:'rbx-give', toId:Number(nearestId), item:item });
    appendChat('Sistem', 'Birine bir ' + item.name + ' verdin! ' + item.emoji);

  // ---- Movement state ----
  var keys = {};
  function isTypingTarget(e){
    var t = e.target;
    return t && (t.tagName === 'INPUT' || t.tagName === 'TEXTAREA');
  }
  window.addEventListener('keydown', function(e){
    if (isTypingTarget(e)) return;

    if (e.code === 'Space') e.preventDefault();

  var velocityY = 0;
  var isGrounded = true;
  var GRAVITY = -32;
  var JUMP_SPEED = 14;
  var WALK_SPEED = 12;
  var RUN_SPEED = 20;
  var MOVE_SPEED = WALK_SPEED;
  var started = false;
  var charFacing = 0; // radians
  var moving = false;
  var walkT = 0;

  // ---- Camera orbit (mouse drag) ----
  var camYaw = Math.PI; // behind character
  var camPitch = 0.35;
  var camDist = 9;
  var dragging = false, lastX = 0, lastY = 0;

  renderer.domElement.addEventListener('mousedown', function(e){ dragging = true; lastX = e.clientX; lastY = e.clientY; });
  window.addEventListener('mouseup', function(){ dragging = false; });
  window.addEventListener('mousemove', function(e){
    if (!dragging) return;
    var dx = e.clientX - lastX, dy = e.clientY - lastY;
    lastX = e.clientX; lastY = e.clientY;
    camYaw -= dx * 0.005;
    camPitch = Math.max(0.08, Math.min(1.2, camPitch - dy * 0.004));
  });
  renderer.domElement.addEventListener('touchstart', function(e){
    if (e.touches.length===1){ dragging = true; lastX = e.touches[0].clientX; lastY = e.touches[0].clientY; }
  }, {passive:true});
  window.addEventListener('touchend', function(){ dragging = false; });
  window.addEventListener('touchmove', function(e){
    if (!dragging || e.touches.length!==1) return;
    var dx = e.touches[0].clientX - lastX, dy = e.touches[0].clientY - lastY;
    lastX = e.touches[0].clientX; lastY = e.touches[0].clientY;
    camYaw -= dx * 0.005;
    camPitch = Math.max(0.08, Math.min(1.2, camPitch - dy * 0.004));
  }, {passive:true});

  window.addEventListener('resize', function(){
    camera.aspect = window.innerWidth/window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);

  var clock = new THREE.Clock();

  function animate(){
    requestAnimationFrame(animate);
    var dt = Math.min(clock.getDelta(), 0.05);

    // movement relative to camera yaw (fwd = away from camera, i.e. the direction the camera looks)
    var fwd = new THREE.Vector3(-Math.sin(camYaw), 0, -Math.cos(camYaw));
    var right = new THREE.Vector3(Math.sin(camYaw + Math.PI/2), 0, Math.cos(camYaw + Math.PI/2));
    var move = new THREE.Vector3();
    if (started){
      if (keys['KeyW'] || keys['ArrowUp']) move.add(fwd);
      if (keys['KeyS'] || keys['ArrowDown']) move.sub(fwd);
      if (keys['KeyD'] || keys['ArrowRight']) move.add(right);
      if (keys['KeyA'] || keys['ArrowLeft']) move.sub(right);
    }

    moving = move.lengthSq() > 0.0001;
    var running = moving && (keys['ShiftLeft'] || keys['ShiftRight']);
    MOVE_SPEED = running ? RUN_SPEED : WALK_SPEED;
    if (moving){
      move.normalize();
      var stepX = move.x * MOVE_SPEED * dt;
      var stepZ = move.z * MOVE_SPEED * dt;
      var curX = character.position.x, curZ = character.position.z;
      if (!hitsSolid(curX + stepX, curZ)) character.position.x = curX + stepX;
      if (!hitsSolid(character.position.x, curZ + stepZ)) character.position.z = curZ + stepZ;
      var targetFacing = Math.atan2(move.x, move.z);
      // shortest-path rotation
      var diff = ((targetFacing - charFacing + Math.PI) % (Math.PI*2)) - Math.PI;
      charFacing += diff * Math.min(1, dt*12);
      character.rotation.y = charFacing;
      walkT += dt * (running ? 13 : 8);
    } else {
      walkT += dt * 2;
    }

    // jump / gravity
    if (started && keys['Space'] && isGrounded){
      velocityY = JUMP_SPEED;
      isGrounded = false;
    }
    velocityY += GRAVITY * dt;
    character.position.y += velocityY * dt;
    if (character.position.y <= 0){
      character.position.y = 0;
      velocityY = 0;
      isGrounded = true;
    }

    // animation
    if (!isGrounded){
      leftArm.rotation.x = -0.6;
      rightArm.rotation.x = -0.6;
      leftLeg.rotation.x = 0.3;
      rightLeg.rotation.x = -0.3;
    } else if (moving){
      var swing = Math.sin(walkT) * 0.9;
      leftArm.rotation.x = -swing;
      rightArm.rotation.x = swing;
      leftLeg.rotation.x = swing;
      rightLeg.rotation.x = -swing;
    } else {
      var idle = Math.sin(walkT) * 0.06;
      leftArm.rotation.x = idle;
      rightArm.rotation.x = -idle;
      leftLeg.rotation.x = 0;
      rightLeg.rotation.x = 0;
    }

    // camera follow (orbit around character)
    var targetPos = character.position.clone().add(new THREE.Vector3(0, 3.2, 0));
    var camOffset = new THREE.Vector3(
      Math.sin(camYaw) * Math.cos(camPitch),
      Math.sin(camPitch),
      Math.cos(camYaw) * Math.cos(camPitch)
    ).multiplyScalar(camDist);
    var desiredCamPos = targetPos.clone().add(camOffset);
    camera.position.lerp(desiredCamPos, Math.min(1, dt*10));
    camera.lookAt(targetPos);

    // smooth remote players toward their latest reported position
    Object.keys(remotePlayers).forEach(function(id){
      var rp = remotePlayers[id];
      rp.group.position.lerp(new THREE.Vector3(rp.target.x, rp.target.y, rp.target.z), Math.min(1, dt*10));
      var diff = ((rp.target.ry - rp.group.rotation.y + Math.PI) % (Math.PI*2)) - Math.PI;
      rp.group.rotation.y += diff * Math.min(1, dt*10);
    });

    // bob interactable markers, and show a prompt when close enough to press E
    var nearestLabel = null;
    interactables.forEach(function(it){
      it.marker.position.y = 1.6 + Math.sin(walkT*0.3 + it.x) * 0.15;
      it.marker.rotation.y += dt;
      var dx = character.position.x - it.x, dz = character.position.z - it.z;
      if (started && dx*dx + dz*dz <= INTERACT_RADIUS*INTERACT_RADIUS) nearestLabel = it.label;
    });
    var prompt = document.getElementById('interact-prompt');
    if (nearestLabel){ prompt.textContent = 'E - ' + nearestLabel; prompt.hidden = false; }
    else { prompt.hidden = true; }

    renderer.render(scene, camera);
  }

  var loadingEl = document.getElementById('loading');
  if (loadingEl) loadingEl.style.display = 'none';

  animate();
})();
</script>
</body>
</html>
