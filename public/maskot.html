<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Maskot - Düt Arena</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Inter:wght@400;600;700&display=swap">
<style>
  :root{
    --bg:#100e1c;
    --panel:#1c1830ee;
    --panel-border:#3a3260;
    --text:#f1edfb;
    --text-dim:#a49bcf;
    --accent:#ffce3d;
    --accent-2:#ff4d94;
    color-scheme: dark;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family:'Inter',system-ui,sans-serif;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:16px;
    padding-block:calc(16px + env(safe-area-inset-top,0px)) calc(16px + env(safe-area-inset-bottom,0px));
  }
  .panel{
    width:100%;
    max-width:460px;
    background:var(--panel);
    border:1px solid var(--panel-border);
    border-radius:16px;
    padding:24px;
    display:flex;
    flex-direction:column;
    gap:14px;
    height:min(640px, 90vh);
  }
  h1{
    font-family:'Press Start 2P',monospace;
    font-size:16px;
    color:var(--accent);
    text-shadow:0 0 14px #ffce3d55;
    margin:0;
    text-align:center;
    letter-spacing:1px;
  }
  .back-link{
    color:var(--text-dim);
    font-size:13px;
    text-decoration:none;
    text-align:center;
  }
  .back-link:hover{ color:var(--accent); }
  .messages{
    flex:1;
    overflow-y:auto;
    display:flex;
    flex-direction:column;
    gap:10px;
    padding:4px;
  }
  .msg{
    max-width:85%;
    padding:10px 14px;
    border-radius:12px;
    font-size:14px;
    line-height:1.45;
    word-break:break-word;
  }
  .msg.user{ align-self:flex-end; background:var(--accent-2); color:#2a0018; }
  .msg.bot{ align-self:flex-start; background:#14111f; border:1px solid var(--panel-border); color:var(--text); }
  .msg.pending{ color:var(--text-dim); font-style:italic; }
  .row{ display:flex; gap:8px; }
  .row input{
    flex:1;
    height:50px;
    padding:0 14px;
    border-radius:10px;
    border:2px solid var(--panel-border);
    background:#14111f;
    color:var(--text);
    font-family:'Inter',system-ui,sans-serif;
    font-size:14px;
    outline:none;
  }
  .row input:focus{ border-color:var(--accent); }
  .row button{
    height:50px;
    padding:0 18px;
    border-radius:10px;
    border:2px solid var(--accent-2);
    background:radial-gradient(circle at 30% 20%, #ff85b8, var(--accent-2));
    color:#2a0018;
    font-weight:700;
    font-size:14px;
    cursor:pointer;
  }
  .note{ color:var(--text-dim); font-size:12px; text-align:center; }
</style>
</head>
<body>

<div class="panel">
  <a class="back-link" href="/">← Ana ekrana dön</a>
  <h1>🤖 MASKOT</h1>
  <div class="messages" id="messages"></div>
  <div class="row">
    <input id="input" type="text" placeholder="Maskota bir şey sor…" maxlength="300">
    <button id="send" type="button">Gönder</button>
  </div>
  <p class="note" id="note" hidden>Maskot şu an bağlı değil, daha sonra tekrar dene.</p>
</div>

<script>
(function(){
  "use strict";
  const messagesEl = document.getElementById('messages');
  const input = document.getElementById('input');
  const sendBtn = document.getElementById('send');
  const note = document.getElementById('note');

  function addMessage(text, cls){
    const el = document.createElement('div');
    el.className = 'msg ' + cls;
    el.textContent = text;
    messagesEl.appendChild(el);
    messagesEl.scrollTop = messagesEl.scrollHeight;
    return el;
  }

  fetch('/api/me').then(r => r.json()).then((info) => {
    if (!info.aiEnabled) {
      note.hidden = false;
      input.disabled = true;
      sendBtn.disabled = true;
    }
  }).catch(() => {});

  async function tryOnce(message){
    const r = await fetch('/api/ai-chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ message }),
    });
    if (!r.ok) throw new Error('bad status');
    return r.json();
  }

  async function send(){
    const text = input.value.trim();
    if (!text) return;
    addMessage(text, 'user');
    input.value = '';
    sendBtn.disabled = true;
    const pending = addMessage('Maskot düşünüyor… (0 sn)', 'bot pending');
    const startedAt = performance.now();
    const ticker = setInterval(() => {
      const secs = Math.floor((performance.now() - startedAt) / 1000);
      pending.textContent = 'Maskot düşünüyor… (' + secs + ' sn)';
    }, 1000);
    try {
      let data;
      try {
        data = await tryOnce(text);
      } catch (e) {
        pending.textContent = 'Tekrar deneniyor…';
        data = await tryOnce(text);
      }
      clearInterval(ticker);
      pending.textContent = data.reply || 'Hmm, cevap veremedim.';
      pending.classList.remove('pending');
    } catch (e) {
      clearInterval(ticker);
      pending.textContent = 'Maskota ulaşılamadı, biraz sonra tekrar dene.';
      pending.classList.remove('pending');
    }
    sendBtn.disabled = false;
  }

  sendBtn.addEventListener('click', send);
  input.addEventListener('keydown', (e) => { if (e.key === 'Enter') send(); });
})();
</script>
</body>
</html>
