<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Maskot - Düt Arena</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Inter:wght@400;600;700&display=swap">
<style>
  :root{
    --bg:#100e1c;
    --panel:#1c1830ee;
    --panel-border:#3a3260;
    --text:#f1edfb;
    --text-dim:#a49bcf;
    --accent:#ffce3d;
    --accent-2:#ff4d94;
    color-scheme: dark;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family:'Inter',system-ui,sans-serif;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:16px;
    padding-block:calc(16px + env(safe-area-inset-top,0px)) calc(16px + env(safe-area-inset-bottom,0px));
  }
  .panel{
    width:100%;
    max-width:460px;
    background:var(--panel);
    border:1px solid var(--panel-border);
    border-radius:16px;
    padding:24px;
    display:flex;
    flex-direction:column;
    gap:14px;
    height:min(640px, 90vh);
  }
  h1{
    font-family:'Press Start 2P',monospace;
    font-size:16px;
    color:var(--accent);
    text-shadow:0 0 14px #ffce3d55;
    margin:0;
    text-align:center;
    letter-spacing:1px;
  }
  .back-link{
    color:var(--text-dim);
    font-size:13px;
    text-decoration:none;
    text-align:center;
  }
  .back-link:hover{ color:var(--accent); }
  .messages{
    flex:1;
    overflow-y:auto;
    display:flex;
    flex-direction:column;
    gap:10px;
    padding:4px;
  }
  .msg{
    max-width:85%;
    padding:10px 14px;
    border-radius:12px;
    font-size:14px;
    line-height:1.45;
    word-break:break-word;
  }
  .msg.user{ align-self:flex-end; background:var(--accent-2); color:#2a0018; }
  .msg.bot{ align-self:flex-start; background:#14111f; border:1px solid var(--panel-border); color:var(--text); }
  .msg.pending{ color:var(--text-dim); font-style:italic; }
  .row{ display:flex; gap:8px; }
  .row input{
    flex:1;
    height:50px;
    padding:0 14px;
    border-radius:10px;
    border:2px solid var(--panel-border);
    background:#14111f;
    color:var(--text);
    font-family:'Inter',system-ui,sans-serif;
    font-size:14px;
    outline:none;
  }
  .row input:focus{ border-color:var(--accent); }
  .row button{
    height:50px;
    padding:0 18px;
    border-radius:10px;
    border:2px solid var(--accent-2);
    background:radial-gradient(circle at 30% 20%, #ff85b8, var(--accent-2));
    color:#2a0018;
    font-weight:700;
    font-size:14px;
    cursor:pointer;
  }
  .note{ color:var(--text-dim); font-size:12px; text-align:center; }
</style>
</head>
<body>

<div class="panel">
  <a class="back-link" href="/" id="back-link">← Ana ekrana dön</a>
  <h1>🤖 MASKOT</h1>
  <div class="messages" id="messages"></div>
  <div class="row">
    <input id="input" type="text" placeholder="Maskota bir şey sor…" maxlength="300">
    <button id="send" type="button">Gönder</button>
  </div>
  <p class="note" id="note" hidden>Maskot şu an bağlı değil, daha sonra tekrar dene.</p>
</div>

<script>
(function(){
  "use strict";
  const messagesEl = document.getElementById('messages');
  const input = document.getElementById('input');
  const sendBtn = document.getElementById('send');
  const note = document.getElementById('note');
  const backLink = document.getElementById('back-link');

  const M = {
    tr: { back:'← Ana ekrana dön', ph:'Maskota bir şey sor…', send:'Gönder', note:'Maskot şu an bağlı değil, daha sonra tekrar dene.', thinking:'Maskot düşünüyor…', retry:'Tekrar deneniyor…', noReply:'Hmm, cevap veremedim.', unreachable:'Maskota ulaşılamadı, biraz sonra tekrar dene.' },
    en: { back:'← Back to home', ph:'Ask the mascot something…', send:'Send', note:'Mascot is offline right now, try again later.', thinking:'Mascot is thinking…', retry:'Retrying…', noReply:'Hmm, could not reply.', unreachable:'Could not reach the mascot, try again soon.' },
    de: { back:'← Zur Startseite', ph:'Frag das Maskottchen etwas…', send:'Senden', note:'Maskottchen ist offline, versuche es später.', thinking:'Maskottchen denkt nach…', retry:'Erneuter Versuch…', noReply:'Hmm, konnte nicht antworten.', unreachable:'Maskottchen nicht erreichbar, versuche es bald erneut.' },
    fr: { back:'← Retour à l\'accueil', ph:'Demande quelque chose à la mascotte…', send:'Envoyer', note:'La mascotte est hors ligne, réessaie plus tard.', thinking:'La mascotte réfléchit…', retry:'Nouvelle tentative…', noReply:'Hmm, pas pu répondre.', unreachable:'Impossible de joindre la mascotte, réessaie bientôt.' },
    es: { back:'← Volver al inicio', ph:'Pregúntale algo a la mascota…', send:'Enviar', note:'La mascota está desconectada, inténtalo más tarde.', thinking:'La mascota está pensando…', retry:'Reintentando…', noReply:'Hmm, no pude responder.', unreachable:'No se pudo contactar a la mascota, inténtalo pronto.' },
    it: { back:'← Torna alla home', ph:'Chiedi qualcosa alla mascotte…', send:'Invia', note:'La mascotte è offline, riprova più tardi.', thinking:'La mascotte sta pensando…', retry:'Nuovo tentativo…', noReply:'Hmm, non ho potuto rispondere.', unreachable:'Impossibile raggiungere la mascotte, riprova presto.' },
    pt: { back:'← Voltar ao início', ph:'Pergunte algo ao mascote…', send:'Enviar', note:'O mascote está offline, tente mais tarde.', thinking:'O mascote está pensando…', retry:'Tentando novamente…', noReply:'Hmm, não consegui responder.', unreachable:'Não foi possível contatar o mascote, tente em breve.' },
    ru: { back:'← На главную', ph:'Спроси что-нибудь у маскота…', send:'Отправить', note:'Маскот сейчас недоступен, попробуй позже.', thinking:'Маскот думает…', retry:'Повтор попытки…', noReply:'Хм, не смог ответить.', unreachable:'Не удалось связаться с маскотом, попробуй скоро снова.' },
    ar: { back:'← العودة للرئيسية', ph:'اسأل التميمة شيئًا…', send:'إرسال', note:'التميمة غير متصلة الآن، حاول لاحقًا.', thinking:'التميمة تفكر…', retry:'إعادة المحاولة…', noReply:'لم أستطع الرد.', unreachable:'تعذر الوصول إلى التميمة، حاول قريبًا مجددًا.' },
    zh: { back:'← 返回主页', ph:'问吉祥物点什么…', send:'发送', note:'吉祥物当前离线，请稍后再试。', thinking:'吉祥物正在思考…', retry:'正在重试…', noReply:'嗯，无法回复。', unreachable:'无法连接到吉祥物，请稍后再试。' },
    ja: { back:'← ホームに戻る', ph:'マスコットに何か聞いてみよう…', send:'送信', note:'マスコットは現在オフラインです、後でもう一度お試しください。', thinking:'マスコットが考え中…', retry:'再試行中…', noReply:'うーん、返信できませんでした。', unreachable:'マスコットに接続できません、もうすぐ再試行してください。' },
    ko: { back:'← 홈으로 돌아가기', ph:'마스코트에게 무언가 물어보세요…', send:'보내기', note:'마스코트가 현재 오프라인입니다, 나중에 다시 시도하세요.', thinking:'마스코트가 생각 중…', retry:'재시도 중…', noReply:'음, 답변할 수 없었어요.', unreachable:'마스코트에 연결할 수 없습니다, 곧 다시 시도하세요.' },
    hi: { back:'← होम पर वापस जाएं', ph:'माहक से कुछ पूछें…', send:'भेजें', note:'माहक अभी ऑफ़लाइन है, बाद में फिर कोशिश करें।', thinking:'माहक सोच रहा है…', retry:'पुनः प्रयास हो रहा है…', noReply:'हम्म, जवाब नहीं दे पाया।', unreachable:'माहक तक नहीं पहुंच सका, जल्द ही फिर कोशिश करें।' },
  };
  const currentLang = localStorage.getItem('dutArenaLang') || 'tr';
  function t(){ return M[currentLang] || M.tr; }

  document.documentElement.lang = currentLang;
  backLink.textContent = t().back;
  input.placeholder = t().ph;
  sendBtn.textContent = t().send;
  note.textContent = t().note;

  function addMessage(text, cls){
    const el = document.createElement('div');
    el.className = 'msg ' + cls;
    el.textContent = text;
    messagesEl.appendChild(el);
    messagesEl.scrollTop = messagesEl.scrollHeight;
    return el;
  }

  fetch('/api/me').then(r => r.json()).then((info) => {
    if (!info.aiEnabled) {
      note.hidden = false;
      input.disabled = true;
      sendBtn.disabled = true;
    }
  }).catch(() => {});

  async function streamOnce(message, pending){
    const r = await fetch('/api/ai-chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ message, lang: currentLang }),
    });
    if (!r.ok || !r.body) throw new Error('bad status');
    const reader = r.body.getReader();
    const decoder = new TextDecoder();
    let full = '';
    let started = false;
    while (true) {
      const { value, done } = await reader.read();
      if (done) break;
      const piece = decoder.decode(value, { stream: true });
      if (piece) {
        if (!started) {
          started = true;
          pending.classList.remove('pending');
          pending.textContent = '';
        }
        full += piece;
        pending.textContent = full;
        messagesEl.scrollTop = messagesEl.scrollHeight;
      }
    }
    return full.trim();
  }

  async function send(){
    const text = input.value.trim();
    if (!text) return;
    addMessage(text, 'user');
    input.value = '';
    sendBtn.disabled = true;
    const pending = addMessage(t().thinking, 'bot pending');
    try {
      let full;
      try {
        full = await streamOnce(text, pending);
      } catch (e) {
        pending.textContent = t().retry;
        pending.classList.add('pending');
        full = await streamOnce(text, pending);
      }
      if (!full) {
        pending.textContent = t().noReply;
        pending.classList.remove('pending');
      }
    } catch (e) {
      pending.textContent = t().unreachable;
      pending.classList.remove('pending');
    }
    sendBtn.disabled = false;
  }

  sendBtn.addEventListener('click', send);
  input.addEventListener('keydown', (e) => { if (e.key === 'Enter') send(); });
})();
</script>
</body>
</html>
